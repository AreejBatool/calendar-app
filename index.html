<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calendar</title>
  <!-- Built from src/input.css with Tailwind CSS v4: npm run build:css -->
  <link rel="stylesheet" href="styles.css">
</head>
<body class="flex flex-col overflow-hidden bg-page text-ink">
  <a class="absolute -top-12 left-2 z-60 rounded-lg bg-accent px-4 py-2 font-medium text-white underline focus:top-2" href="#main">Skip to calendar</a>
  <header class="topbar flex min-h-16 flex-none items-center gap-1 px-4 py-2 phone:gap-0.5 phone:p-2 tiny:flex-wrap">
    <button id="menuBtn" class="icon-btn" aria-label="Main menu" aria-controls="sidebar" aria-expanded="true">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
    </button>
    <div class="flex w-49 items-center gap-2.5 pl-1 tablet:w-auto tablet:pr-2 phone:hidden">
      <span class="flex size-10 flex-col overflow-hidden rounded-lg border-2 border-accent bg-surface before:h-[9px] before:flex-none before:bg-accent" aria-hidden="true"><span id="appIconDay" class="grid flex-1 place-items-center text-[15px] font-bold text-accent"></span></span>
      <span class="text-[22px] tablet:hidden">Calendar</span>
    </div>
    <button id="todayBtn" class="mr-2 h-10 flex-none rounded-full border border-field bg-surface px-[22px] font-medium hover:bg-hover phone:mr-0 phone:h-9 phone:px-2.5 phone:text-[14px]">Today</button>
    <button id="prevBtn" class="icon-btn" aria-label="Previous week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
    </button>
    <button id="nextBtn" class="icon-btn" aria-label="Next week">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
    </button>
    <h1 id="periodTitle" class="ml-3 min-w-0 flex-1 truncate text-[22px] font-normal phone:ml-1 phone:text-[15px] tiny:order-10 tiny:mt-1 tiny:ml-2 tiny:basis-full" aria-live="polite"></h1>
    <label class="view-select tiny:ml-auto">
      <span class="sr-only">View</span>
      <select id="viewSelect">
        <option value="week">Week</option>
        <option value="month">Month</option>
      </select>
    </label>
  </header>

  <div class="layout flex min-h-0 flex-1">
    <aside id="sidebar" class="sidebar" aria-label="Sidebar">
      <button id="createBtn" class="mt-1 mb-6 inline-flex h-14 items-center gap-3 rounded-2xl bg-surface pr-6 pl-4 font-medium shadow-fab hover:shadow-fab-hover [&_svg]:size-6 [&_svg]:fill-ink" aria-haspopup="dialog">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
        Create
      </button>

      <section class="mb-6" aria-labelledby="miniTitle">
        <div class="flex items-center pl-2">
          <h2 id="miniTitle" class="flex-1 text-[14px] font-medium"></h2>
          <button id="miniPrev" class="icon-btn size-8 [&_svg]:size-5" aria-label="Previous month (date picker)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.41 7.41 14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
          </button>
          <button id="miniNext" class="icon-btn size-8 [&_svg]:size-5" aria-label="Next month (date picker)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.59 16.59 10 18l6-6-6-6-1.41 1.41L13.17 12z"/></svg>
          </button>
        </div>
        <div id="miniGrid" class="grid grid-cols-7 text-center"></div>
      </section>

      <section aria-labelledby="calsTitle">
        <h2 id="calsTitle" class="mb-1 ml-2 text-[15px] font-medium">My calendars</h2>
        <ul id="calList"></ul>
      </section>
    </aside>
    <div id="scrim" class="tablet:fixed tablet:inset-0 tablet:z-35 tablet:bg-scrim" hidden></div>

    <main id="main" class="panel focus:outline-none" tabindex="-1">
      <div id="weekView" class="flex min-h-0 flex-1 flex-col">
        <div id="weekHead" class="week-head"></div>
        <div id="weekAllDay" class="week-allday"></div>
        <div id="weekBody" class="week-body"></div>
      </div>
      <div id="monthView" class="flex min-h-0 flex-1 flex-col" hidden>
        <div id="monthHead" class="month-head" aria-hidden="true"></div>
        <div id="monthGrid" class="month-grid" role="list" aria-label="Days of the month"></div>
      </div>
    </main>
  </div>

  <!-- Add / edit event -->
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <h2 id="modalTitle" class="mb-4 text-[20px] font-normal">Add event</h2>
      <form id="eventForm" novalidate>
        <label>Title <span class="text-danger" aria-hidden="true">*</span>
          <input id="fTitle" type="text" maxlength="100" required autocomplete="off" aria-describedby="eTitle">
        </label>
        <span class="error" id="eTitle" data-for="title"></span>
        <div class="flex gap-3">
          <label class="min-w-0 flex-1">Date <span class="text-danger" aria-hidden="true">*</span>
            <input id="fDate" type="date" required aria-describedby="eDate">
          </label>
          <label class="min-w-0 flex-1">Calendar
            <select id="fCal"></select>
          </label>
        </div>
        <span class="error" id="eDate" data-for="date"></span>
        <div class="flex gap-3">
          <label class="min-w-0 flex-1">Start
            <input id="fStart" type="time" aria-describedby="eTime">
          </label>
          <label class="min-w-0 flex-1">End
            <input id="fEnd" type="time" aria-describedby="eTime">
          </label>
        </div>
        <span class="error" id="eTime" data-for="time"></span>
        <label>Description
          <textarea id="fDesc" rows="3"></textarea>
        </label>
        <div class="mt-3 flex gap-2">
          <button type="button" id="deleteBtn" class="btn danger" hidden>Delete</button>
          <span class="flex-1"></span>
          <button type="button" id="cancelBtn" class="btn text">Cancel</button>
          <button type="submit" class="btn primary">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- All events on one day -->
  <div id="dayModal" class="modal" hidden>
    <div class="modal-box" role="dialog" aria-modal="true" aria-labelledby="dayTitle">
      <h2 id="dayTitle" class="mb-4 text-[20px] font-normal"></h2>
      <ul id="dayList" class="day-list"></ul>
      <div class="mt-3 flex gap-2">
        <span class="flex-1"></span>
        <button type="button" id="dayCloseBtn" class="btn text">Close</button>
        <button type="button" id="dayAddBtn" class="btn primary">Add event</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
